; Process supervision inside the container.
;
; Ordering matters: Xvfb and PulseAudio must exist before openbox, and openbox
; must exist before the game (Zero Hour clips the cursor to its window on
; WM_ACTIVATE and needs a window manager to hand it focus). supervisord has no
; dependency graph, so each unit waits for its own preconditions in its script.
[supervisord]
nodaemon=true
user=root
logfile=/var/log/cnc/supervisord.log
pidfile=/run/cnc/supervisord.pid
childlogdir=/var/log/cnc
loglevel=info

[unix_http_server]
file=/run/cnc/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/cnc/supervisor.sock

[program:xvfb]
command=/opt/cnc/scripts/start-xvfb.sh
priority=10
user=wine
autorestart=true
startsecs=2
stdout_logfile=/var/log/cnc/xvfb.log
stderr_logfile=/var/log/cnc/xvfb.err

[program:pulseaudio]
command=/opt/cnc/scripts/start-pulse.sh
priority=15
user=wine
autorestart=true
startsecs=2
stdout_logfile=/var/log/cnc/pulse.log
stderr_logfile=/var/log/cnc/pulse.err

[program:openbox]
command=/usr/bin/openbox --config-file /opt/cnc/config/openbox-rc.xml
priority=20
user=wine
autorestart=true
startretries=20
startsecs=2
stdout_logfile=/var/log/cnc/openbox.log
stderr_logfile=/var/log/cnc/openbox.err

[program:game]
command=/opt/cnc/scripts/launch-game.sh
priority=30
user=wine
; unexpected == restart on a non-zero exit, but let a clean quit stay quit.
autorestart=unexpected
exitcodes=0
startretries=3
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/cnc/game.log
stderr_logfile=/var/log/cnc/game.err

[program:focus]
command=/opt/cnc/scripts/focus-watchdog.sh
priority=35
user=wine
autorestart=true
stdout_logfile=/var/log/cnc/focus.log
stderr_logfile=/var/log/cnc/focus.err

[program:streamer]
command=/usr/bin/python3 -u /opt/cnc/streamer/server.py
priority=40
user=wine
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/cnc/streamer.log
stderr_logfile=/var/log/cnc/streamer.err
