# Sunshine host configuration for the Zero Hour container.
#
# Assumes the main container's X display and PulseAudio sink, and software
# encoding (there is no GPU in the default deployment).

# --- capture ---------------------------------------------------------------
# Grab the same X screen the game renders into.
capture = x11
output_name = 0
# Must match SCREEN_WIDTH / SCREEN_HEIGHT / GAME_FPS in .env. Sunshine will not
# resize the display for us here -- Xvfb has exactly one fixed mode.
min_log_level = info

# --- encoding --------------------------------------------------------------
# software x264. Set to nvenc / vaapi / amdvce if a GPU is passed through.
encoder = software
sw_preset = superfast
sw_tune = zerolatency
# Zero Hour self-limits to about 30fps; capturing faster only burns CPU.
fps = [30]
resolutions = [1600x900]
# Keep the stream honest about being a fixed-resolution capture.
dwmflush = disabled

# --- audio -----------------------------------------------------------------
# The monitor of the null sink the container creates.
audio_sink = cnc_sink.monitor
# Sunshine must not try to create or steal a virtual sink of its own.
virtual_sink =

# --- input -----------------------------------------------------------------
# Absolute pointer positioning is what an RTS needs; relative mode makes edge
# scrolling and box selection unusable.
back_button_timeout = -1
keybindings = []
# Gamepad emulation needs /dev/uinput; off by default because it requires extra
# container privileges and this game does not use one.
gamepad = disabled

# --- network ---------------------------------------------------------------
origin_web_ui_allowed = lan
upnp = off
